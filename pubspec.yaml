name: cubacargo
description: CubaCargo app MVP for heavy load logistics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  provider: ^6.1.2

  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.9.0

  cupertino_icons: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
